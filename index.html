<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorTrack — Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <!-- Left Side: Branding -->
        <div class="auth-left">
            <div class="auth-left-logo">
                <strong>TutorTrack</strong>
            </div>
            <div class="circle-shape"></div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="auth-right">
            <div class="auth-box">
                <p class="tagline">Welcome back</p>
                <h2>Sign in to your account</h2>
                <p class="subtext">Enter your email to continue to the prototype.</p>

                <form action="dashboard.php" method="POST">
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" class="form-control" placeholder="tutor@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <div class="flex-between mb-6">
                        <label style="font-size:14px; font-weight:normal;">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" style="color:var(--primary); font-size:13px; text-decoration:none;">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary">Sign in →</button>
                </form>

                <div class="auth-link">
                    Not a Tutor yet? <a href="signup.php">Create account</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
