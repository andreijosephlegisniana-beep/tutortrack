<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorTrack — Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <!-- RIGHT SIDE — Form (White Background) -->
    <div class="auth-right">
        <p class="subtitle-small">Welcome Back</p>
        <h2>Sign in to your account</h2>
        <p class="subtitle">Enter your email to continue to the prototype.</p>
        
        <form>
            <div class="form-group">
                <label>Email address</label>
                <input type="email" placeholder="tutor@example.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter password">
            </div>
            
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            
            <button type="submit" class="btn-primary">Sign in →</button>
        </form>
        
        <p class="auth-bottom-link">
            Not a Tutor yet? <a href="signup.html">Create account</a>
        </p>
    </div>

    <!-- LEFT SIDE — Logo (Blue Background) -->
    <div class="auth-left">
        <div class="auth-left-logo">
            <img src="images/logo.png" alt="TutorTrack Logo">
            <span>TutorTrack</span>
        </div>
    </div>
</div>

</body>
</html>
